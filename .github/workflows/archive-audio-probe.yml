name: Historical Daft Punk audio archive probe
on:
  push:
    paths: ['.github/workflows/archive-audio-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Internet Archive and alternative historical indexes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, time
          def test(label,url,timeout=16):
            print('===',label,'===',flush=True)
            req=urllib.request.Request(url,headers={'User-Agent':'DaftPunkHomeworkPreservation/1.0 (research; low-rate)'})
            try:
              with urllib.request.urlopen(req,timeout=timeout) as resp:
                print('HTTP',resp.status,'TYPE',resp.headers.get('Content-Type'),'FINAL',resp.url)
                print('BODY',resp.read(700).decode('utf-8','replace')[:700])
            except Exception as exc: print(type(exc).__name__,str(exc)[:350])
          candidates=[
            ('archive.org availability','https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':'http://www.daftpunk.com/swa/world.swa','timestamp':'19990101'})),
            ('CDX exact 1997-2003','https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':'www.daftpunk.com/swa/world.swa','output':'json','from':'1997','to':'2003'})),
            ('CDX domain small','https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':'daftpunk.com','matchType':'domain','from':'1997','to':'2001','output':'json','filter':'urlkey:.*swa.*','limit':'15'})),
            ('arquivo.pt metadata','https://arquivo.pt/wayback/cdx?'+urllib.parse.urlencode({'url':'www.daftpunk.com/swa/world.swa','output':'json'})),
            ('archive-it availability','https://arquivo.pt/textsearch?'+urllib.parse.urlencode({'versionHistory':'www.daftpunk.com/swa/world.swa'})),
            ('Wayback replay exact','https://web.archive.org/web/19981205102256id_/http://www.daftpunk.com/swa/world.swa'),
          ]
          for label,url in candidates:test(label,url)
          PY
