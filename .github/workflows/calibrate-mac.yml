name: Calibrate clean Macintosh desktop
on:
  push:
    paths: ['.github/workflows/calibrate-mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - name: Boot clean Mac and capture disk layout
        run: |
          mkdir -p debug/clean
          cat >run.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await b.newPage({viewport:{width:800,height:600}});
            const url='https://infinitemac.org/embed?'+new URLSearchParams({disk:'Mac OS 8.1',machine:'Power Macintosh 9500',infinite_hd:'false',saved_hd:'false',library:'false',disk_url:'https://raw.githubusercontent.com/NuSchuz/daft-punk-homework/main/assets/daft-punk-toy.img',screenSize:'640x480'});
            page.on('console',m=>{if(m.type()==='error')console.log('ERROR',m.text().slice(0,500))});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(25000);
            await page.screenshot({path:'debug/clean/desktop-25.png'});
            await page.waitForTimeout(10000);
            await page.screenshot({path:'debug/clean/desktop-35.png'});
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node run.cjs
          for f in debug/clean/*.png;do base64 -w0 "$f" > "$f.b64";done
      - name: Save diagnostic images
        if: always()
        run: |
          git add debug/clean || true
          if ! git diff --cached --quiet;then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save clean Mac desktop screenshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
