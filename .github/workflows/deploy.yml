name: Deploy Daft Punk Homework restoration

on:
  push:
    branches: [main]
    paths:
      - 'DAFT_PUNK_SITE_UPLOAD.zip'
      - '.github/workflows/deploy.yml'
      - 'overrides/**'
      - 'tools/build_toy_disk.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the verified restoration
        run: |
          set -euo pipefail
          ZIP="DAFT_PUNK_SITE_UPLOAD.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing $ZIP. Upload the ZIP file to the repository root."
            exit 1
          fi
          mkdir -p public
          unzip -q "$ZIP" -d public
          test -s public/index.html
          test -s public/menu.dcr
          test -s public/player/dirplayer-polyfill.js
          test -s public/player/ruffle/5e2fd696fbae2cd6d375.wasm
          touch public/.nojekyll
          echo "Restoration files extracted:"
          find public -type f | wc -l

      - name: Preserve and mount the original 1998 Macintosh toy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unar hfsutils
          python3 tools/build_toy_disk.py public
          cp overrides/toy.html public/toy.html
          cp overrides/toy-mac.html public/toy-mac.html
          test -s public/daft-punk-toy.img
          echo "Embedded 1998 Macintosh toy disk: $(du -h public/daft-punk-toy.img)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
