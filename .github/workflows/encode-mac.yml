name: Encode Mac diagnostic captures
on:
  push:
    paths: ['.github/workflows/encode-mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert screenshots to diagnostic text
        run: |
          for f in debug/boot/mac-12.png debug/boot/mac-75.png; do base64 -w0 "$f" > "$f.b64"; done
          git add debug/boot/*.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Encode Mac boot captures [skip ci]'
          git push origin HEAD:main
