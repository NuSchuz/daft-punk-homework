name: Inspect classic Macintosh boot desktop
on:
  push:
    paths: ['.github/workflows/inspect-mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - name: Capture boot stages
        shell: bash
        run: |
          mkdir -p debug/boot
          cat >/tmp/inspect.cjs <<'EOF'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const page=await b.newPage({viewport:{width:1024,height:900}});
            page.on('console', msg=>console.log('BROWSER',msg.type(),msg.text().slice(0,200)));
            page.on('pageerror',err=>console.log('PAGE ERROR',err.toString().slice(0,200)));
            await page.goto('https://nuschuz.github.io/daft-punk-homework/toy-mac.html?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#start').click();
            let prev=0;
            for(const sec of [12,30,52,75]){
              await page.waitForTimeout((sec-prev)*1000);prev=sec;
              await page.locator('#mac').screenshot({path:'debug/boot/mac-'+sec+'.png',timeout:10000});
              console.log('CAPTURE',sec,'frame URL',page.locator('#mac').getAttribute('src'));
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node /tmp/inspect.cjs
      - name: Preserve diagnostic screenshots
        if: always()
        run: |
          git add debug/boot || true
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Capture Mac OS desktop for autolaunch calibration [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
