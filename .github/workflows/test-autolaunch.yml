name: Test automatic Macintosh cleanup
on:
  push:
    paths: ['.github/workflows/test-autolaunch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - name: Test scripted quit of Stickies
        run: |
          mkdir -p debug/auto
          cat >run.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await b.newPage({viewport:{width:800,height:600}});
            await page.goto('https://nuschuz.github.io/daft-punk-homework/toy-mac.html?v=clean-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#start').click();
            const send=async d=>page.evaluate(d=>document.querySelector('#mac').contentWindow.postMessage(d,'https://infinitemac.org'),d);
            await page.waitForTimeout(19000);
            await page.locator('#mac').screenshot({path:'debug/auto/before.png'});
            // Infinite Mac embed receives commands via iframe postMessage
            await send({type:'emulator_mouse_move',x:515,y:110});
            await send({type:'emulator_mouse_down',button:0});
            await send({type:'emulator_mouse_up',button:0});
            await page.waitForTimeout(600);
            await send({type:'emulator_key_down',code:'MetaLeft'});
            await send({type:'emulator_key_down',code:'KeyQ'});
            await page.waitForTimeout(180);
            await send({type:'emulator_key_up',code:'KeyQ'});
            await send({type:'emulator_key_up',code:'MetaLeft'});
            await page.waitForTimeout(3000);
            await page.locator('#mac').screenshot({path:'debug/auto/after.png'});
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node run.cjs
          for f in debug/auto/*.png;do base64 -w0 "$f" > "$f.b64";done
      - name: Save screenshots
        if: always()
        run: |
          git add debug/auto || true
          if ! git diff --cached --quiet;then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save autolaunch calibration snapshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
