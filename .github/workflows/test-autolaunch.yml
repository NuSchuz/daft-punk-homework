name: Test automatic Macintosh cleanup
on:
  push:
    paths: ['.github/workflows/test-autolaunch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - name: Test scripted quit of Stickies
        run: |
          mkdir -p debug/auto
          cat >run.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await b.newPage({viewport:{width:800,height:600}});
            const url='https://infinitemac.org/embed?'+new URLSearchParams({disk:'Mac OS 8.1',machine:'Power Macintosh 9500',infinite_hd:'false',saved_hd:'false',library:'false',disk_url:'https://raw.githubusercontent.com/NuSchuz/daft-punk-homework/main/assets/daft-punk-toy.img',screenSize:'640x480'});
            page.on('console',m=>{if(m.type()==='error')console.log('ERROR',m.text().slice(0,400))});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            function post(data){return page.evaluate(d=>window.postMessage(d,'*'),data)}
            await page.waitForTimeout(19000);
            await page.screenshot({path:'debug/auto/before.png'});
            const frame=page.frameLocator('iframe');
            const send=async d=>page.evaluate(d=>{window.postMessage(d,'*')},d);
            // Infinite Mac embed sends messages to its own window via postMessage
            await send({type:'emulator_mouse_move',x:515,y:110});
            await send({type:'emulator_mouse_down',button:0});
            await send({type:'emulator_mouse_up',button:0});
            await page.waitForTimeout(600);
            await send({type:'emulator_key_down',code:'MetaLeft'});
            await send({type:'emulator_key_down',code:'KeyQ'});
            await page.waitForTimeout(180);
            await send({type:'emulator_key_up',code:'KeyQ'});
            await send({type:'emulator_key_up',code:'MetaLeft'});
            await page.waitForTimeout(3000);
            await page.screenshot({path:'debug/auto/after.png'});
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node run.cjs
          for f in debug/auto/*.png;do base64 -w0 "$f" > "$f.b64";done
      - name: Save screenshots
        if: always()
        run: |
          git add debug/auto || true
          if ! git diff --cached --quiet;then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save autolaunch calibration snapshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
