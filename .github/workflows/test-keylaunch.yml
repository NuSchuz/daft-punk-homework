name: Calibrate automatic Daft Punk toy launch
on:
  push:
    paths: ['.github/workflows/test-keylaunch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - name: Test Finder keyboard-based application launch
        run: |
          mkdir -p debug/keylaunch
          cat >run.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await b.newPage({viewport:{width:900,height:900}});
            await page.goto('https://nuschuz.github.io/daft-punk-homework/toy-mac.html?launchtest='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#start').click();
            const send=async d=>page.evaluate(d=>document.querySelector('#mac').contentWindow.postMessage(d,'https://infinitemac.org'),d);
            const key=async code=>{await send({type:'emulator_key_down',code});await page.waitForTimeout(120);await send({type:'emulator_key_up',code});await page.waitForTimeout(450)};
            const open=async()=>{await send({type:'emulator_key_down',code:'MetaLeft'});await page.waitForTimeout(150);await key('KeyO');await send({type:'emulator_key_up',code:'MetaLeft'});await page.waitForTimeout(700)};
            const shot=async name=>page.locator('#mac').screenshot({path:'debug/keylaunch/'+name+'.png'});
            await page.waitForTimeout(19000);
            await shot('before');
            await key('KeyD');await shot('selectdisk');
            await open();await shot('opendisk');
            await key('KeyP');await shot('selectapp');
            await open();await page.waitForTimeout(3500);await shot('launch');
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node run.cjs
          for f in debug/keylaunch/*.png;do base64 -w0 "$f" > "$f.b64";done
      - name: Store diagnostic screenshots
        if: always()
        run: |
          git add debug/keylaunch || true
          if ! git diff --cached --quiet;then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save keyboard launch test screenshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
