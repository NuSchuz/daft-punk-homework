name: Verify automatic Phoenix launch end to end
on:
  push:
    paths: ['.github/workflows/verify-phoenix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - name: Load real embed and capture automatic launch
        run: |
          mkdir -p debug/verify
          cat >verify.cjs <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await b.newPage({viewport:{width:900,height:1100}});
            page.on('console',m=>{if(m.type()==='error')console.log('ERROR',m.text().slice(0,400))});
            await page.goto('https://nuschuz.github.io/daft-punk-homework/toy-mac.html?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#start').click();
            await page.waitForTimeout(12000);
            await page.locator('#mac').screenshot({path:'debug/verify/booting.png'});
            console.log('STATUS at 12s:',await page.locator('#status').innerText());
            await page.waitForTimeout(33000);
            await page.locator('#mac').screenshot({path:'debug/verify/auto-launched.png'});
            console.log('STATUS at 45s:',await page.locator('#status').innerText());
            console.log('MASK visible:',await page.locator('#bootmask').isVisible());
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node verify.cjs
          for f in debug/verify/*.png;do base64 -w0 "$f" > "$f.b64";done
      - name: Save verification screenshots
        if: always()
        run: |
          git add debug/verify || true
          if ! git diff --cached --quiet;then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save auto-launch verification images [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
